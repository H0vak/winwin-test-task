server.port=8080
spring.web.error.include-message=always

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/winwin_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration-ms=86400000

internal.data-api.url=${DATA_API_URL:http://localhost:8081/api/transform}
internal.security.token=${INTERNAL_TOKEN:dev-internal-token}